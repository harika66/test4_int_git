name: Polaris Security Scan

on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release

  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release

  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  polaris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Debug Variables
        run: |
          echo "POLARIS_URL='${{ vars.POLARIS_URL }}'"

      - name: Call Pre-Scan API
        run: |
          curl -X 'POST' \
          'https://poc.polaris.blackduck.com/api/portfolios/a0fcefe1-1955-4a31-9ba6-e6eafc19347f/applications/6d39e5b8-28c7-48a4-a678-e1500c846e39/projects/d153e305-bf7a-426c-a819-d722db7b6465/branches' \
          -H 'accept: application/vnd.polaris.portfolios.branches-1+json' \
          -H 'Api-Token: rvb1uibn0h59d9e6tnba154883v1hvv500lkvnc8ivordthuodmtape4fp636eghp0t8fi6pfniki' \
          -H 'Content-Type: application/vnd.polaris.portfolios.branches-1+json' \
          -H 'X-Client-Source: dev-portal' \
          -d '{
            "name": "main",
            "source": "CI",
            "isDefault": false
          }'

      - name: Polaris Security Scan
        id: polaris-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          ### SCANNING: Required fields
          polaris_server_url: https://poc.polaris.blackduck.com
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          ### ASSESSMENT TYPES
          polaris_assessment_types: SAST  # Comma-separated list: SAST,SCA,DAST
          polaris_test_sast_type: SAST-RAPID
          ### SCANNING: Optional fields
          polaris_test_sast_location: hybrid
          polaris_test_sca_location: hybrid
          ### Configuration if Bridge diagnostic files needs to be uploaded
          include_diagnostics: true
          ### GITHUB TOKEN
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Required when PR comments or sarif reports enabled
          polaris_prComment_enabled: true
          ### FIX PULL REQUEST CREATION
          polaris_fixpr_enabled: true
          polaris_externalIssues_create: true
          ### SARIF report parameters
          polaris_reports_sarif_create: true  # Create SARIF report and upload it as artifact

          ### Mark build status if policy violating issues are found
          # mark_build_status: failure # Set to success, failure, or skip

          ### SCANNING: Optional fields
          # polaris_prComment_enabled: false
